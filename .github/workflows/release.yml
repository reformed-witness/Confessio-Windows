name: Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  DOTNET_VERSION: '8.0.x'

jobs:
  build-release:
    name: Build Release
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      # Build self-contained EXE (x64)
      - name: Publish self-contained (x64)
        run: |
          dotnet publish Confessio/Confessio.csproj -c Release -r win-x64 --self-contained true -o ./publish/win-x64
        working-directory: ${{ github.workspace }}

      # Build self-contained EXE (ARM64)
      - name: Publish self-contained (ARM64)
        run: |
          dotnet publish Confessio/Confessio.csproj -c Release -r win-arm64 --self-contained true -o ./publish/win-arm64
        working-directory: ${{ github.workspace }}

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: |
            ./publish/win-x64/Confessio.exe
            ./publish/win-arm64/Confessio.exe
          retention-days: 30

  create-release:
    name: Create GitHub Release
    needs: build-release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-artifacts

      - name: Get version
        id: version
        run: |
          TAG=${{ github.ref_name }}
          VERSION=${TAG#v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag_date=$(date +%Y-%m-%d)" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          prerelease: false
          generate_release_notes: true
          files: |
            publish/win-x64/Confessio.exe
            publish/win-arm64/Confessio.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}